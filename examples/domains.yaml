# Extra decision domains loaded at startup via DDE_DOMAINS=examples/domains.yaml.
# Each entry is a pack descriptor as pure data — no code, no recompile. These are
# text/prompt domains: the prompt_template is appended to the base planner prompt,
# and validation rules are declarative shape checks.
domains:
  - id: fitness
    name: Fitness
    # version and prompt_version default to "1" and "<id>-v1" when omitted.
    prompt_template: |
      DOMAIN: FITNESS
      Treat each move as a training experiment aimed at one measurable adaptation
      (strength, endurance, mobility, body composition). For every move:
      - Name the adaptation it targets and the single metric that tracks it.
      - Prefer progressive, recoverable bets; respect sleep, time and injury risk.
      - Make kill_criteria the absence of measurable progress within the window.
      Be honest about recovery cost and adherence; a plan nobody sustains fails.
    eval:
      # Materiality threshold: a new signal must move top-move confidence by this
      # much to cut a new plan version.
      confidence_delta: 0.15
    vocab:
      asset_kinds: [time, equipment, coaching, baseline_fitness]
      constraint_kinds: [injury, schedule, recovery, budget]
      signal_kinds: [progress_check, injury, plateau, life_event]
    validation:
      # Off by default; set true to warn on asset/constraint kinds outside the vocab.
      warn_unknown_kinds: false
      rules:
        - check: require_metric
          field: metric
          message: "no fitness metric set; training experiments cannot be scored"
          severity: warning
        - check: require_any_kind
          kinds: [schedule, recovery]
          scopes: [constraint]
          field: context.constraints
          message: "no schedule or recovery constraint; plans may be unsustainable"
          severity: warning

  - id: purchasing
    name: Purchasing
    prompt_template: |
      DOMAIN: PURCHASING
      Frame each move as a buying decision: what to buy, when, and from whom, given
      the budget and constraints. For every move:
      - State the option (product/vendor) and why it best fits the objective.
      - Respect budget, deadline and policy constraints as hard limits.
      - Use live facts (prices, availability, delivery) when present in context;
        prefer the cheapest acceptable option that meets the requirements.
      - Make kill_criteria a price/availability threshold that should trigger a
        re-decision (e.g. "abort if price rises above budget before purchase").
      Be explicit about trade-offs; a "wait for a better price" move is valid when
      justified by the deadline.
    # Consult the "pricefeed" source (defined in the sources file, DDE_SOURCES)
    # before planning, folding live prices/availability into the goal context.
    source_kinds: [pricefeed]
    eval:
      # Purchases react to price moves, so a modest confidence shift is material.
      confidence_delta: 0.08
    vocab:
      asset_kinds: [budget, existing_equipment, loyalty, data]
      constraint_kinds: [budget, deadline, brand_policy, warranty]
      signal_kinds: [price_drop, out_of_stock, new_model, review_change]
    validation:
      warn_unknown_kinds: false
      rules:
        - check: require_any_kind
          kinds: [budget]
          scopes: [constraint]
          field: context.constraints
          message: "no budget constraint; purchase options cannot be bounded"
          severity: warning
