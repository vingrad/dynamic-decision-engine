# Local development stack: database, API, admin UI and an observability stack.
# Bring everything up with: docker compose up --build
name: dynamic-decision-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dde
      POSTGRES_PASSWORD: dde
      POSTGRES_DB: dde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dde -d dde"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DDE_HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://dde:dde@postgres:5432/dde?sslmode=disable"
      DDE_LOG_FORMAT: "json"
      DDE_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./web/admin
      dockerfile: Dockerfile
    environment:
      # Server-side calls go to the api service inside the compose network;
      # browser calls use the public URL.
      DDE_API_URL: "http://api:8080"
      NEXT_PUBLIC_DDE_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_GRAFANA_URL: "http://localhost:3001"
    ports:
      - "3000:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
