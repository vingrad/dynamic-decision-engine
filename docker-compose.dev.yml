# Local development stack — complete and self-contained. Run with:
#   docker compose -f docker-compose.dev.yml up --build
#
# A Caddy reverse proxy fronts everything at http://localhost (same-origin: the
# browser calls relative /v1/* and Caddy routes them to the API). Service ports
# are also published directly for debugging, but open the app via http://localhost
# (not :3000) — browser write actions only reach the API through the proxy.
#
# This file is intentionally separate from docker-compose.prod.yml rather than a
# shared base + overrides: each environment is one file you can read top to bottom.
name: dynamic-decision-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dde
      POSTGRES_PASSWORD: dde
      POSTGRES_DB: dde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dde -d dde"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DDE_HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://dde:dde@postgres:5432/dde?sslmode=disable"
      DDE_LOG_FORMAT: "json"
      # Bring-your-own-key planner: each request supplies its own LLM key via the
      # X-LLM-* headers, falling back to the deterministic mock when none is sent.
      DDE_PLANNER: "byok"
      DDE_CORS_ALLOWED_ORIGINS: "http://localhost"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./web/admin
      dockerfile: Dockerfile
    environment:
      # SSR calls reach the API inside the compose network; browser calls are
      # same-origin (relative /v1/*) and routed by Caddy, so NEXT_PUBLIC_* are left
      # unset (the frontend defaults to same-origin and /grafana).
      DDE_API_URL: "http://api:8080"
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    environment:
      # Plain HTTP on localhost for local dev (no TLS).
      DDE_SITE_ADDRESS: "http://localhost"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
    depends_on:
      - api
      - admin

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Served under /grafana behind the proxy, same as prod, so the admin UI's
      # "Grafana" link (which points at /grafana) works at http://localhost/grafana.
      # The shared Caddyfile routes /grafana* to this service in both environments,
      # so dev must serve from the subpath too or the link 404s.
      GF_SERVER_ROOT_URL: "http://localhost/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
  caddy_data:
  caddy_config:
